[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "expertiseos"
version = "0.1.0"
description = "Local-first expertise and learning support for coding agents"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.12",
]
g0 = ["basic-memory==0.23.2"]

[project.scripts]
expertiseos = "expertiseos.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expertiseos"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: deterministic component integration checks",
  "external: checks that require a separately installed external dependency",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

